<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial Reconstruction Lab</title>
  <style>
    html, body { height: 100%; margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
    body { display: grid; grid-template-columns: 280px 1fr; }
    aside { padding: 16px; background: #1d1d1d; overflow: auto; }
    main { position: relative; min-width: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    label { display: block; margin: 16px 0 6px; }
    input[type=range] { width: 100%; }
    img { width: 100%; margin-top: 12px; }
    button { padding: 8px 12px; }
    #status { color: #aaa; line-height: 1.4; }
  </style>
</head>
<body>
  <aside>
    <h2>2.5D reconstruction</h2>
    <p id="status">Loading point cloud...</p>
    <label for="point-size">Point size</label>
    <input id="point-size" type="range" min="0.5" max="8" step="0.1" value="2">
    <button id="reset">Reset camera</button>
    <h3>Source image</h3>
    <img src="../assets/input/world-labs-workshop.webp" alt="World Labs workshop source image">
    <h3>Estimated depth</h3>
    <img src="../output/depth_visualization.png" alt="Estimated relative depth visualization">
    <p>Drag to orbit. Scroll to zoom. The cloud is single-view pseudo-depth, not a complete world.</p>
  </aside>
  <main><canvas id="viewport"></canvas></main>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

    const canvas = document.querySelector("#viewport");
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
    const controls = new OrbitControls(camera, renderer.domElement);
    const status = document.querySelector("#status");
    const response = await fetch("../output/pointcloud.json");
    const data = await response.json();
    const positions = new Float32Array(data.points.length * 3);
    const colors = new Float32Array(data.points.length * 3);
    data.points.forEach((point, index) => {
      positions.set(point.xyz, index * 3);
      colors.set(point.color.map(value => value / 255), index * 3);
    });
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    const material = new THREE.PointsMaterial({size: 0.02, vertexColors: true, sizeAttenuation: true});
    const cloud = new THREE.Points(geometry, material);
    scene.add(cloud);
    geometry.computeBoundingSphere();
    const radius = geometry.boundingSphere.radius || 1;
    camera.position.set(0, 0, radius * 2.5);
    controls.target.copy(geometry.boundingSphere.center);
    controls.update();
    status.textContent = `${data.points.length.toLocaleString()} points; relative depth; arbitrary scale`;
    document.querySelector("#point-size").addEventListener("input", event => {
      material.size = Number(event.target.value) / 100;
    });
    document.querySelector("#reset").addEventListener("click", () => {
      camera.position.set(0, 0, radius * 2.5);
      controls.target.copy(geometry.boundingSphere.center);
      controls.update();
    });
    function resize() {
      const {clientWidth, clientHeight} = canvas;
      renderer.setSize(clientWidth, clientHeight, false);
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas);
    function animate() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate); }
    animate();
  </script>
</body>
</html>
